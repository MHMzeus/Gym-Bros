<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="Front_page.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="favicon" rel="icon" href="/Almost_finalized_pages/Logo/Fitness_Mavericks.png">
    <title>Fitness Mavericks</title>

</head>
<body>

<header class="peamine-pais">
    <div class="logo-ala">
        <img href="Maverick_Front_Page.html" src="/Almost_finalized_pages/Logo/Fitness_Mavericks_Valge.png" alt="Fitness Mavericks Icon">
        <a href="Maverick_Front_Page.html">Fitness Mavericks</a>
    </div>

    <nav class="menu-ala">
        <audio src="/Almost_finalized_pages/Audio/Cut_Button_Audio.mp3" id="mavAudio" preload="auto"></audio>
        <input class="input-mode" type="checkbox" id="darkmode-toggle">
        <label class="toggle-mode" for="darkmode-toggle"></label>
        <div class="background-shift"></div>
        <a href="" class="btn" onclick="playMavAudio()">Keha Trenn</a>
        <a href="" class="btn" onclick="playMavAudio()">Mida Saavutad?</a>
        <a href="Maverick_meist.html" class="btn" onclick="playMavAudio()">Meist</a>
        <a href="Maverick_kontaktid.html" class="btn" onclick="playMavAudio()">Kontaktid</a>
    </nav>
</header>

<hr>

<!--Image-->
<section class="section">
        <!--header and paragraph and button-->
        <div class="description">
            <h1>Sissejuhatav header</h1>
            <p>Sisu...</p>
            <a href="">Keha Trenn</a>
        </div>
        <div class="image">
            <img src="/Almost_finalized_pages/Images/Calisthenics_Master.jpg" alt="Fitness">
        </div>
</section>

<!--image and license-->

<div class="bottom_license">
<hr>

<p>&copy; 2026 Fitness Mavericks</p>
</div>

<!--Logo dark mode changer-->
<script>
    const Toggle = document.querySelector('.input-mode');
    const mavImage = document.querySelector('.logo-ala img');

    Toggle.addEventListener('change', () => {
        const Dark = Toggle.checked;

    if (mavImage) {
        mavImage.src = Dark ? '/Almost_finalized_pages/Logo/Fitness_Mavericks.png' : '/Almost_finalized_pages/Logo/Fitness_Mavericks_Valge.png'

    }
    });
</script>

<script>
    const mavButton = document.getElementById("mavAudio");
    
    function playMavAudio() {
        mavButton.play();
    }

    //link configuration
    const buttonLinks = document.querySelectorAll("a[href]");
    const delay = 100; //millisekundid
    
    mavButton.addEventListener("canplaythrough", () => {
        buttonLinks.forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.preventDefault(); // Prevent immediate navigation
                const href = btn.getAttribute("href");
                setTimeout(() => {
                    window.location = href;
                }, mavButton.duration * 1000 + delay);
            })
        })
    })
</script>

</body>
</html>
