<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/Almost_finalized_pages/CSS/Front_page.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="favicon" rel="icon" href="/Almost_finalized_pages/Logo/Fitness_Mavericks.png">
    <title>Fitness Mavericks</title>

</head>
<body>

<header class="peamine-pais">

    <!--Audio elemendid-->
    <audio src="/Almost_finalized_pages/Audio/Button_Sound_Effect.mp3" id="mavAudio1" preload="auto"></audio>
    <audio src="/Almost_finalized_pages/Audio/Main_Page.mp3" id="mavAudio2" preload="auto"></audio>
    <audio src="/Almost_finalized_pages/Audio/Shift_SFX.mp3" id="mavAudio3" preload="auto"></audio>
    <audio src="/Almost_finalized_pages/Audio/Cut_Button_Audio.mp3" id="mavAudio4" preload="auto"></audio>

    <div class="logo-ala">
        <img src="/Almost_finalized_pages/Logo/Fitness_Mavericks_Valge.png" alt="Fitness Mavericks Icon">
        <a href="Maverick_Front_Page.html" onclick="playMavAudio('mavAudio2')">Fitness Mavericks</a>
    </div>

    <nav class="menu-ala">
        <input class="input-mode" type="checkbox" id="darkmode-toggle" onclick="playMavAudio('mavAudio3')">
        <label class="toggle-mode" for="darkmode-toggle"></label>
        <div class="background-shift"></div>
        <a href="Maverick_keha_trenn.html" class="btn" onclick="playMavAudio('mavAudio1')">Keha Trenn</a>
        <a href="Maverick_meist.html" class="btn" onclick="playMavAudio('mavAudio1')">Meist</a>
        <a href="Maverick_kontaktid.html" class="btn" onclick="playMavAudio('mavAudio1')">Kontaktid</a>
    </nav>
</header>

<hr>

<!--Image-->
<section class="section">
        <!--header and paragraph and button-->
        <div class="description">
            <h1>Sissejuhatav header</h1>
            <p>Sisu...</p>
            <details class="btn" onclick="playMavAudio('mavAudio4')">
            <summary>Loe rohkem</summary>
            <p>Rohkem Sisu...</p>
            </details>
        </div>
        <div class="image">
            <img src="/Almost_finalized_pages/Images/Calisthenics_Master.jpg" alt="Fitness">
        </div>
</section>

<!--image and license-->

<div class="bottom_license">
<hr>

<p>&copy; 2026 Fitness Mavericks</p>
</div>

<!--Logo dark mode changer-->
<script>
    const Toggle = document.querySelector('.input-mode');
    const mavImage = document.querySelector('.logo-ala img');

    Toggle.addEventListener('change', () => {
        const Dark = Toggle.checked;
    if (mavImage) {
        mavImage.src = Dark ? '/Almost_finalized_pages/Logo/Fitness_Mavericks.png' : '/Almost_finalized_pages/Logo/Fitness_Mavericks_Valge.png'
    }
    });
</script>

<script>
    var mavButton = document.getElementById("mavAudio1");
    
    function playMavAudio(audioId) {
        var mavButton = document.getElementById(audioId)
        mavButton.play(audioId);
    }

    //link configuration
    const buttonLinks = document.querySelectorAll("a[href]");
    
    mavButton.addEventListener("canplaythrough", () => {
        buttonLinks.forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.preventDefault();
                const href = btn.getAttribute("href");
                setTimeout(() => {
                    window.location = href;
                }, mavButton.duration * 650);
            })
        })
    })
</script>

</body>
</html>
