<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/Almost_finalized_pages/CSS/Kontaktid_page.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="favicon" rel="icon" href="/SCRIPTS/Markkus_Hendrik_Marken/Icon/Fitness_Mavericks.png">
    <title>Fitness Mavericks</title>

</head>
<body>

<header class="peamine-pais">

    <!--Audio elemendid-->
    <audio src="/Almost_finalized_pages/Audio/Button_Sound_Effect.mp3" id="mavAudio1" preload="auto"></audio>
    <audio src="/Almost_finalized_pages/Audio/Main_Page.mp3" id="mavAudio2" preload="auto"></audio>
    <audio src="/Almost_finalized_pages/Audio/Shift_SFX.mp3" id="mavAudio3" preload="auto"></audio>
    <audio src="/Almost_finalized_pages/Audio/Cut_Button_Audio.mp3" id="mavAudio4" preload="auto"></audio>

    <div class="logo-ala">
        <img src="/Almost_finalized_pages/Logo/Fitness_Mavericks_Valge.png" alt="Fitness Mavericks Icon" id="maverick_logo">
        <a href="Maverick_Front_Page.html" onclick="playMavAudio('mavAudio2')">Fitness Mavericks</a>
    </div>

    <nav class="menu-ala">
        <input class="input-mode" type="checkbox" id="darkmode-toggle" onclick="playMavAudio('mavAudio3')">
        <label class="toggle-mode" for="darkmode-toggle"></label>
        <div class="background-shift"></div>
        <a href="Maverick_keha_trenn.html" class="btn" onclick="playMavAudio('mavAudio1')">Treeningujuhised</a>
        <a href="Maverick_meist.html" class="btn" onclick="playMavAudio('mavAudio1')">Meist</a>
        <a href="Maverick_kontaktid.html" class="btn" onclick="playMavAudio('mavAudio1')">Kontaktid</a>
    </nav>
</header>

<hr>
<!--Sisestusvorm-->
<form class="vormi-ala" action="https://formsubmit.co/739c859060750635e4178e7fba8dcd45" method="post">
    <h2>Sisestage teave küsimuste või probleemi korral!</h2>
    <input type="text" name="name" id="gmail" placeholder="Name">
    <input type="email" name="email" placeholder="Email">
    <input type="text" name="subject" placeholder="Subject">
    <textarea name="message" placeholder="Message"></textarea>
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="box">
    <button type="submit" class="btn" onclick="playMavAudio('mavAudio4')">Submit</button>
</form>
<!--license-->

<div class="bottom_license">
<hr>

<p>&copy; 2026 Fitness Mavericks</p>
</div>

<!--Logo dark mode changer-->
<script src="/Almost_finalized_pages/SCRIPTS/Logo_Shifting.js"></script>

<script>
    var mavButton = document.getElementById("mavAudio1");
    
    function playMavAudio(audioId) {
        var mavButton = document.getElementById(audioId)
        mavButton.play(audioId);
    }

    //link configuration
    const buttonLinks = document.querySelectorAll("a[href]");
    
    mavButton.addEventListener("canplaythrough", () => {
        buttonLinks.forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.preventDefault(); // Prevent immediate navigation
                const href = btn.getAttribute("href");
                setTimeout(() => {
                    window.location = href;
                }, mavButton.duration * 650);
            })
        })
    })
</script>

</body>
</html>
