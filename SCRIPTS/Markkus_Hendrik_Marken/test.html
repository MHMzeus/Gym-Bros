<html lang="en">
<head>
    <link rel="stylesheet" href="prototype.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="favicon" rel="icon" href="/SCRIPTS/Markkus_Hendrik_Marken/Icon/Fitness_Mavericks.png">

<body>

<header class="peamine-pais">
    <div class="logo-ala">
        <img src="/SCRIPTS/Markkus_Hendrik_Marken/Icon/Fitness_Mavericks_Valge.png" alt="Fitness Mavericks Icon">
        <p><b>Fitness Mavericks</b></p>
    </div>


    <nav class="menu-ala">
        <input class="input-mode" type="checkbox" id="darkmode-toggle">
        <label class="toggle-mode" for="darkmode-toggle"></label>
        <div class="background-shift"></div>
        <a href="" class="btn">Keha Trenn</a>
        <a href="" class="btn">Mida Saavutad?</a>
        <a href="" class="btn">Meist</a>
        <a href="" class="btn">Kontaktid</a>
    </nav>
</header>

<!--Logo dark mode changer-->
<script>
    const Toggle = document.querySelector('.input-mode');
    const mavImage = document.querySelector('.logo-ala img');

    Toggle.addEventListener('change', () => {
        const Dark = Toggle.checked;

    if (mavImage) {
        mavImage.src = Dark ? '/SCRIPTS/Markkus_Hendrik_Marken/Icon/Fitness_Mavericks.png' : '/SCRIPTS/Markkus_Hendrik_Marken/Icon/Fitness_Mavericks_Valge.png'

    }
    });
</script>
