<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/darkomed-logo.png">
    <title>Fitness Mavericks/Team</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>
<header class="peamine-pais">
    <div class="logo-ala">
        <img src="images/darkomed-logo.png" alt="Fitness Mavericks icon">
        <a href="kood.html">Fitness Mavericks</a>
    </div>

    <nav class="menu-ala" aria-label="Põhinavigatsioon">
        <input class="input-mode" type="checkbox" id="darkmode-toggle">
        <label class="toggle-mode" for="darkmode-toggle" aria-label="Vaheta tumedat ja heledat režiimi"></label>
        <a href="Keha_trenn.html" class="btn">Keha trenn</a>
        <a href="Maverick_mida_saavutad.html" class="btn">Mida saavutad?</a>
        <a href="team.html" class="btn">Meist</a>
        <a href="#" class="btn">Kontaktid</a>
    </nav>
</header>

<hr>

<main>
    <div class="sisu-ala">
        <h1>Meie tiim</h1>
        <p>Tutvu Fitness Mavericksi meeskonnaga.</p>
    </div>

    <div class="description-ala">
        <dl class="tiimi-ala">
            <div class="pildi-kast">
                <img src="images/David_pilt.jpg" alt="David Chiboshvili">
            </div>
            <div class="kaardi-sisu">
                <dt class="liikme-nimi">David Chiboshvili</dt>
                <dd class="liikme-roll">UI-disainer ja logo artist</dd>
                <dt class="sisu-pealkiri">Kirjeldus</dt>
                <dd class="liikme-kirjeldus">Tartu Ülikooli tudeng, kelle huvialadeks on programmeerimine ja disain.</dd>
                <dt class="sisu-pealkiri">Portfoolio</dt>
                <dd class="liikme-portfoolio"><a href="https://github.com/davidson-python">Vaata portfooliot</a></dd>
            </div>
        </dl>
    </div>
</main>

<div class="bottom_license">
    <hr>
    <p>&copy; 2026 Fitness Mavericks</p>
</div>

<script>
    const toggle = document.querySelector('.input-mode');
    const mavImage = document.querySelector('.logo-ala img');

    function updateLogo() {
        mavImage.src = toggle.checked
            ? 'images/Fitness_Mavericks.png'
            : 'images/darkomed-logo.png';
    }

    toggle.addEventListener('change', updateLogo);
    updateLogo();
</script>

</body>
</html>
